<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Тактический бой · D&D 2024</title>
    <style>
      /*__STYLE__*/
    </style>
  </head>
  <body>
    <main id="combat-app">
      <header>
        <div>
          <small id="campaign-label">D&D 2024</small>
          <h1 id="battle-name"></h1>
          <p id="source-status"></p>
        </div>
        <div class="round" id="round"></div>
      </header>
      <div class="toolbar">
        <button data-op="new">Новый учебный бой</button
        ><button data-op="save">Сохранить</button
        ><button data-op="export">Скачать сохранение</button
        ><button data-op="import">Загрузить сохранение</button
        ><button data-op="report" id="report-button">Итоги для мастера</button
        ><button data-op="fullscreen">На весь экран</button>
        <details class="tools">
          <summary>Бои и настройки</summary>
          <div class="toolbox">
            <button data-op="scenario">Загрузить сценарий</button>
            <button data-op="pack">Загрузить пакет кампании</button>
            <select id="recovery" aria-label="Открыть сохранённый бой"></select>
            <button data-op="recover">Предыдущее сохранение</button>
            <p id="storage-usage"></p>
            <button data-op="archive-export">Выгрузить архив</button>
            <button data-op="export-current-new">
              Скачать текущий, удалить его из браузера и начать новый
            </button>
            <label
              >Удаление старого боя после выгрузки<select
                id="archive-session"
              ></select
            ></label>
            <button data-op="archive-delete" id="archive-delete" disabled>
              Удалить выбранный старый бой
            </button>
            <label
              >Бой из загруженного архива<select id="archive-imported"></select
            ></label>
            <button data-op="archive-restore" id="archive-restore" disabled>
              Восстановить из архива
            </button>
          </div>
        </details>
        <span id="save-status"></span>
      </div>
      <input
        type="file"
        id="import-file"
        accept="application/json"
        hidden
      /><input
        type="file"
        id="scenario-file"
        accept="application/json"
        hidden
      />
      <input type="file" id="pack-file" accept="application/json" hidden />
      <div class="layout">
        <section class="map-column">
          <div id="queue" class="queue"></div>
          <div class="board-frame">
            <div
              id="board"
              class="board"
              role="grid"
              aria-label="Поле боя"
            ></div>
          </div>
          <div id="notice" role="status"></div>
          <div id="route"></div>
          <div class="legend">
            Клетка — 5 футов · светлая рамка — текущий участник · бронзовая —
            выбранная цель
          </div>
          <details>
            <summary>Участники и доступное снаряжение</summary>
            <div id="inspector"></div>
          </details>
        </section>
        <aside>
          <div id="actor"></div>
          <div id="decision" aria-live="polite"></div>
          <div id="actions"></div>
          <div id="abilities"></div>
          <div id="magic"></div>
          <div id="policies"></div>
          <div id="turn-controls"></div>
        </aside>
      </div>
      <section class="journal-section">
        <div class="journal-title">
          <h2>Журнал боя</h2>
          <button data-op="journal">Показать весь журнал</button
          ><button data-op="journal-export">Скачать журнал</button>
        </div>
        <div id="journal"></div>
      </section>
    </main>
    <script type="application/json" id="runtime">
      /*__RUNTIME__*/
    </script>
    <script type="application/json" id="scene">
      /*__SCENE__*/
    </script>
    <script type="application/json" id="artpack">
      /*__ART__*/
    </script>
    <script>
      /*__CODE__*/
    </script>
  </body>
</html>
