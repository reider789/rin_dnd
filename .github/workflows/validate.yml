name: Rin Combat v30
on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'sdk/**'
      - 'web/**'
      - 'config/**'
      - 'encounters/**'
      - 'examples/**'
      - 'tools/**'
      - 'tests/**'
      - 'art/**'
      - 'assets/**'
      - 'state/**'
      - 'rules/**'
      - 'index.html'
      - '*manifest.json'
      - 'entrypoint.json'
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'core/**'
      - 'sdk/**'
      - 'web/**'
      - 'config/**'
      - 'encounters/**'
      - 'examples/**'
      - 'tools/**'
      - 'tests/**'
      - 'art/**'
      - 'assets/**'
      - 'state/**'
      - 'rules/**'
      - 'index.html'
      - '*manifest.json'
      - 'entrypoint.json'
      - '.github/workflows/validate.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: combat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  combat:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      # Test the CURRENT source rather than aborting on a previous offline build.
      # Keep a strict post-test drift guard: generated artifacts MUST be committed
      # before a release/merge can be considered ready.
      - run: python tools/build_rin.py
      - run: python tools/run_tests.py --suite combat --browser
      - name: Persist generated offline artifacts on same-repository draft PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # CI can still be running for an older PR head while new commits
          # arrive. Never overwrite them or treat a non-fast-forward as an
          # error in the already superseded workflow run.
          git fetch origin "$PR_HEAD_REF"
          if [ "$(git rev-parse FETCH_HEAD)" != "$(git rev-parse HEAD)" ]; then
            echo "Preview head advanced; its own newer validation will publish the bundle."
            git restore -- index.html config/rin_runtime.json rin-build-manifest.json entrypoint.json current-manifest.json
            exit 0
          fi
          git add -- index.html config/rin_runtime.json rin-build-manifest.json entrypoint.json current-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "build: synchronize level-11 offline artifacts"
            if ! git push origin "HEAD:refs/heads/$PR_HEAD_REF"; then
              echo "Preview branch advanced during push; the next PR run owns publication."
              git reset --hard HEAD~1
            fi
          fi
      - name: Check committed offline bundle matches current code
        run: git diff --exit-code -- index.html config/rin_runtime.json rin-build-manifest.json entrypoint.json current-manifest.json
