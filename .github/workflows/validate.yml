name: Rin Combat v30
on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'sdk/**'
      - 'web/**'
      - 'config/**'
      - 'encounters/**'
      - 'examples/**'
      - 'tools/**'
      - 'tests/**'
      - 'art/**'
      - 'assets/**'
      - 'state/**'
      - 'rules/**'
      - 'index.html'
      - '*manifest.json'
      - 'entrypoint.json'
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'core/**'
      - 'sdk/**'
      - 'web/**'
      - 'config/**'
      - 'encounters/**'
      - 'examples/**'
      - 'tools/**'
      - 'tests/**'
      - 'art/**'
      - 'assets/**'
      - 'state/**'
      - 'rules/**'
      - 'index.html'
      - '*manifest.json'
      - 'entrypoint.json'
      - '.github/workflows/validate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: combat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  combat:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      # Test the CURRENT source rather than aborting on a previous offline build.
      # Keep a strict post-test drift guard: generated artifacts MUST be committed
      # before a release/merge can be considered ready.
      - run: python tools/build_rin.py
      - run: python tools/run_tests.py --suite combat --browser
      - name: Check committed offline bundle matches current code
        run: git diff --exit-code -- index.html config/rin_runtime.json rin-build-manifest.json entrypoint.json current-manifest.json
