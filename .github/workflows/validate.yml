name: Rin Combat v30
on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'sdk/**'
      - 'web/**'
      - 'config/**'
      - 'encounters/**'
      - 'examples/**'
      - 'tools/**'
      - 'tests/**'
      - 'art/**'
      - 'assets/**'
      - 'state/**'
      - 'rules/**'
      - 'index.html'
      - '*manifest.json'
      - 'entrypoint.json'
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'core/**'
      - 'sdk/**'
      - 'web/**'
      - 'config/**'
      - 'encounters/**'
      - 'examples/**'
      - 'tools/**'
      - 'tests/**'
      - 'art/**'
      - 'assets/**'
      - 'state/**'
      - 'rules/**'
      - 'index.html'
      - '*manifest.json'
      - 'entrypoint.json'
      - '.github/workflows/validate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: combat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  combat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python tools/run_tests.py --suite combat --browser
