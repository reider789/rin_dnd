name: Rin Campaign Engine Tests
on:
  push:
    branches: [main]
    paths:
      - 'tools/campaign*.py'
      - 'tools/*registry.py'
      - 'tools/knowledgegraph.py'
      - 'tools/scene_context.py'
      - 'tools/sync_*.py'
      - 'tools/build_city_map.py'
      - 'state/**'
      - 'rules/**'
      - 'views/**'
      - 'map/**'
      - 'tests_campaign/**'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  campaign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/run_tests.py
